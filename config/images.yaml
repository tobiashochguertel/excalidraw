# Images for the self-hosted Excalidraw deployment.
#
# This file drives the build/verify scripts (scripts/ in this repo) and
# documents what is downloaded and with which parameters. The *running*
# deployment config (ports, CORS, healthchecks) lives in the services
# repo: ~/work/services/kroki/docker-compose.yml (+ .env).
#
# Rebuild:  mise run build-image
# Verify:   mise run verify-collab

client:
  # Local build tag (not pushed to a registry).
  tag: excalidraw:fork-collab
  # Digest of the last built image (docker inspect --format '{{index .RepoDigests 0}}').
  digest: sha256:c2d913538fb35803ab5173901af678bc654b756addec456aa837d54946c681e5
  source:
    upstream: https://github.com/excalidraw/excalidraw.git
    fork: https://github.com/tobiashochguertel/excalidraw.git
    # Upstream master at build time + the fork commit carrying the
    # Dockerfile change (collab URL as build arg).
    # Quoted: YAML would parse digit+e-digit SHAs (e.g. 6e06595) as floats.
    upstream_commit: "f1a79b7"
    fork_commit: "6e06595"
  # Build args baked into the image at build time (Vite inlines them;
  # process env wins over .env.production). Quoted: YAML would parse
  # "true" as a boolean.
  build_args:
    VITE_APP_WS_SERVER_URL: ws://localhost:44749
    VITE_APP_DISABLE_PLUS: "true"
  # Loopback host port the app is published on (services repo .env).
  port: 44186

room:
  image: excalidraw/excalidraw-room:latest
  digest: sha256:2fe999f9be4379e3ee282fc45d75d84a691a6383dde33544514cc395287c7a70
  # Loopback host port the relay is published on; must match the
  # VITE_APP_WS_SERVER_URL baked into the client image.
  port: 44749
  env:
    PORT: "80"
    CORS_ORIGIN: http://localhost:44186

deployment:
  compose_file: ~/work/services/kroki/docker-compose.yml
  services:
    - excalidraw-app
    - excalidraw-room
